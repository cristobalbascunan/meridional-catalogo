# Dominio canónico: www.meridionalplastic.com. El pregenerado
# (scripts/prerender.mjs) ya genera las URL canónicas, el sitemap y el
# og:image con ese dominio.
#
# meridionalplastic.com (sin www) NO redirige aquí: se probó con
# `nginx.ingress.kubernetes.io/permanent-redirect`, pero el webhook de
# admisión de este cluster rechaza cualquier valor con `$` (así que no admite
# `$request_uri`, imprescindible para no perder la ruta al redirigir) y las
# snippets están desactivadas («Snippet directives are disabled by the
# Ingress administrator»). En vez de perder la ruta o pelearnos con la
# política del cluster, este Ingress reenvía las dos direcciones al mismo
# servicio y es el propio nginx del contenedor (nginx.conf) quien redirige
# meridionalplastic.com → www conservando la ruta.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogo-ingress
  namespace: meridional-plastic
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.meridionalplastic.com
        - meridionalplastic.com
      secretName: meridionalplastic-com-tls
  rules:
    - host: www.meridionalplastic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalogo-service
                port:
                  number: 80
    - host: meridionalplastic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalogo-service
                port:
                  number: 80
