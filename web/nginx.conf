# El dominio canónico es www.meridionalplastic.com; meridionalplastic.com
# (sin www) redirige aquí. El Ingress del cluster no puede hacerlo él mismo
# preservando la ruta: su webhook de admisión rechaza cualquier `$` dentro de
# `permanent-redirect` (y las snippets están desactivadas), así que la
# redirección se hace en este nginx, que sí es nuestro. El Ingress reenvía la
# cabecera Host original de la petición, así que este bloque sólo entra en
# juego para el dominio sin www.
server {
    listen       80;
    server_name  meridionalplastic.com;
    return 301 https://www.meridionalplastic.com$request_uri;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    # Los ficheros de assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    location /img/ {
        expires    30d;
        add_header Cache-Control "public";
    }

    # Ningún HTML se cachea, así un despliegue nuevo se ve al instante. Con el
    # pregenerado ya no hay un solo index.html, sino uno por ficha.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # Cada ficha se sirve desde `producto/<id>/index.html`, que deja el
    # pregenerado; `$uri/` es quien lo encuentra. El /index.html final es la red
    # de seguridad para cualquier dirección que no tenga página propia: la
    # aplicación arranca igualmente y resuelve la ruta por su cuenta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
