<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!--
      El título y la descripción de aquí son los de la portada. `scripts/prerender.mjs`
      los reescribe en cada ficha al compilar, así que conviene dejarlos en una
      sola línea y con este formato para que los reemplace sin fallar.
    -->
    <title>Envases y embalajes en Zaragoza | Meridional Plastic, S.L.</title>
    <meta
      name="description"
      content="Precinto, film estirable, burbuja, fleje, cartón, palés y maquinaria de embalaje. Ficha técnica y presupuesto sin compromiso en Zaragoza."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Meridional Plastic, S.L." />
    <meta name="theme-color" content="#0d6dff" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridional Plastic" />
    <meta property="og:title" content="Envases y embalajes en Zaragoza | Meridional Plastic, S.L." />
    <meta
      property="og:description"
      content="Precinto, film estirable, burbuja, fleje, cartón, palés y maquinaria de embalaje. Ficha técnica y presupuesto sin compromiso en Zaragoza."
    />
    <!--
      Las redes sociales necesitan una dirección absoluta para poder descargar la
      imagen. El pregenerado la completa con el dominio de `SITE_URL`, en
      src/data/catalog.ts, tanto aquí como en cada ficha.
    -->
    <meta property="og:image" content="https://www.meridionalplastic.com/img/hero-tapes.jpg" />
    <meta property="og:image:alt" content="Bobinas de precinto de Meridional Plastic" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fondo de la portada: es el elemento más grande de la primera pantalla y
         va referenciado desde el CSS, así que sin esto se pide tarde. -->
    <link rel="preload" as="image" href="/img/hero-tapes.jpg" fetchpriority="high" />

    <!--
      El pregenerado (scripts/prerender.mjs) pone el catálogo entero en #root para
      los buscadores y para quien no tiene JavaScript. Verlo unos instantes y que
      luego React lo sustituya por la interfaz real se notaba como un parpadeo de
      HTML sin estilo. Se oculta hasta que React monta (que lo reemplaza); sigue en
      el documento, así que los buscadores lo leen igual. Dos salvaguardas para no
      dejar nunca la página en blanco: sin JavaScript (noscript) se muestra, y si
      el script tardara más de 4 s —red muy lenta o error— reaparece solo.
    -->
    <style>
      #root > .mp-static {
        visibility: hidden;
        animation: mp-static-show 0s 4s forwards;
      }
      @keyframes mp-static-show {
        to {
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        #root > .mp-static {
          visibility: visible;
          animation: none;
        }
      </style>
    </noscript>
    <!--
      Los datos estructurados (Organization en la portada y Product en cada
      ficha) los inyecta `scripts/prerender.mjs` al compilar, para que cada
      página lleve los suyos.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      Con el pregenerado, sin JavaScript se sigue leyendo el catálogo entero y
      cada ficha: lo que se pierde es el buscador, los filtros y el formulario.
    -->
    <noscript>
      <p style="font-family: sans-serif; padding: 1rem 2rem; margin: 0">
        Con JavaScript desactivado puede consultar el catálogo y las fichas, pero no
        el buscador ni los filtros. Para pedir presupuesto, escríbanos a
        <a href="mailto:info@meridionalplastic.com">info@meridionalplastic.com</a> o llame al
        <a href="tel:+34976158711">976 158 711</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
