services:
  # Catálogo compilado y servido con nginx, tal como quedaría publicado.
  catalogo:
    build: ./web
    ports:
      - "8080:80"
    restart: unless-stopped

  # Servidor de desarrollo con recarga en caliente, para ir viendo los cambios.
  # Se arranca sólo cuando se pide: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
